map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}


server {
    listen 80;
    server_name soo.it.kr www.soo.it.kr;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name soo.it.kr www.soo.it.kr;

    ssl_certificate     /etc/nginx/ssl/www.soo.it.kr_fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/www.soo.it.kr.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    resolver 127.0.0.11 valid=30s;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Admin API
    location ^~ /api/v1/auth/admin/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_admin app-admin;
        proxy_pass http://$upstream_admin:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth Methods
    location ^~ /api/v1/auth/email/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_email app-email;
        proxy_pass http://$upstream_email:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/auth/id/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_id app-id;
        proxy_pass http://$upstream_id:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/auth/sms/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_sms app-sms;
        proxy_pass http://$upstream_sms:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/auth/oauth2/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_oauth2 app-oauth2;
        proxy_pass http://$upstream_oauth2:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Common Auth (Token, Session)
    location ^~ /api/v1/auth/token/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_common app-common;
        proxy_pass http://$upstream_common:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/auth/session/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_common app-common;
        proxy_pass http://$upstream_common:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /login/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_common app-common;
        proxy_pass http://$upstream_common:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API & Others
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_common app-common;
        proxy_pass http://$upstream_common:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    location = /docs {
        return 301 /docs/;
    }

    location ^~ /docs/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_common app-common;
        proxy_pass http://$upstream_common:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /prometheus {
        resolver 127.0.0.11 valid=30s;
        set $upstream_common app-common;
        proxy_pass http://$upstream_common:8080/actuator/prometheus;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    location ^~ /phpmyadmin/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_pma phpmyadmin;
        proxy_pass http://$upstream_pma:80/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix /phpmyadmin;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location ^~ /grafana/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_grafana grafana;
        proxy_pass http://$upstream_grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    location ^~ /loki/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_loki loki;
        proxy_pass http://$upstream_loki:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_fe frontend;
        proxy_pass http://$upstream_fe:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_fe frontend;
        proxy_pass http://$upstream_fe:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}