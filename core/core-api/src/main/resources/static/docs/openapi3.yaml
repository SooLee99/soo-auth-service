                    \ : \"2026-03-20T21:07:34.818539679\",\n    \"request\" : {\n\
                    \      \"path\" : \"/api/v1/services/SHOP/auth/local/token/refresh\"\
                    ,\n      \"method\" : \"POST\"\n    }\n  },\n  \"data\" : {\n\
                    \    \"serviceCode\" : \"SHOP\",\n    \"tokens\" : {\n      \"\
                    accessToken\" : \"access-token\",\n      \"accessExpiresInSec\"\
                    \ : 3600,\n      \"refreshToken\" : \"refresh-token\",\n     \
                    \ \"refreshExpiresInSec\" : 1209600\n    }\n  }\n}"
