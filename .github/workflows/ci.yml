name: Auth Service CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, "ai/**", "chore/**", "feature/**"]

jobs:
  kotlin-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Secret pattern check
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|\.env\..*|id_rsa|id_ed25519|credentials\.json|token\.json|service-account.*\.json)$' | grep -Ev '(^|/)\.env\.example$'; then
            echo "Blocked secret-like file detected"
            exit 1
          fi

          if git grep -n -E '(xoxb-[A-Za-z0-9-]{20,}|xapp-[A-Za-z0-9-]{20,}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN ([A-Z]+ )?PRIVATE KEY-----)' -- . ':!*.md' ':!.env.example'; then
            echo "Potential secret detected"
            exit 1
          fi

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ktlint
        run: ./gradlew ktlintCheck

      - name: Test
        run: ./gradlew test

      - name: Compile core auth
        run: ./gradlew :core:core-auth-common:compileKotlin
