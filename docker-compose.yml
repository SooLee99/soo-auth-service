name: soo-auth

include:
  - path: deploy/docker-compose.auth-email.yml
  - path: deploy/docker-compose.auth-id.yml
  - path: deploy/docker-compose.auth-sms.yml
  - path: deploy/docker-compose.auth-oauth2.yml
  - path: deploy/docker-compose.auth-common.yml
  - path: deploy/docker-compose.admin.yml

networks:
  backend:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
  loki_data:
  grafana_data:

services:
  mariadb:
    image: mariadb:11.2
    profiles: ["core"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      TZ: Asia/Seoul
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      backend:
        aliases:
          - mariadb
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      backend:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    profiles: ["web"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    image: ${DOCKER_HUB_USERNAME}/auth-admin-frontend:latest
    profiles: ["web"]
    pull_policy: always
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    expose:
      - "80"
    networks:
      - backend