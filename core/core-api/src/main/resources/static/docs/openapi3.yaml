  /api/v1/services/{serviceCode}/auth/local/token/refresh:
    post:
      tags:
      - Auth
      summary: 서비스별 토큰 재발급(Refresh)
      description: "serviceCode 기준 경로에서 Refresh Token으로 Access Token을 재발급합니다.\n\n\
        ### 인증\n- 인증 불필요(일반적으로 refreshToken 자체가 인증 수단)\n- `serviceCode` 유효성/활성 상태\
        \ 검증\n\n### 헤더\n- `X-Device-Id`: 디바이스 식별자\n\n### Path 파라미터\n- `serviceCode`:\
        \ 서비스 코드 (예: SHOP, CRM, DEFAULT)\n\n### 요청 바디 필드\n- `refreshToken`: 리프레시 토\
        큰\n\n### 응답 바디 필드\n- `result`: 요청 처리 결과 (SUCCESS/ERROR)\n- `meta.timestamp`:\
        \ 응답 생성 시각 (서버 로컬 시간)\n- `meta.requestId`: 요청 추적 ID (있을 때만 반환)\n- `meta.durationMs`:\
        \ 처리 시간(ms)\n- `meta.request.path`: 요청 경로\n- `meta.request.method`: HTTP 메\
        서드\n- `meta.request.query`: 쿼리 문자열 (없으면 null)\n- `meta.paging`: 페이징 메타 정보\
        \ (있을 때만 반환)\n- `meta.locale`: 응답 로케일 (있을 때만 반환)\n- `error`: 오류 정보 (에러 응답에\
        서만 포함)\n- `data`: 토큰 재발급 결과\n- `data.serviceCode`: 적용 서비스 코드\n- `data.tokens`:\
        \ 재발급 토큰\n- `data.tokens.accessToken`: 액세스 토큰\n- `data.tokens.accessExpiresInSec`:\
        \ 액세스 토큰 만료(초)\n- `data.tokens.refreshToken`: 리프레시 토큰\n- `data.tokens.refreshExpiresInSec`:\
        \ 리프레시 토큰 만료(초)\n\n### 공통 에러\n- **401** 인증 실패/만료/위조\n- **403** 권한 없음(권한 필요\
        한 API)\n- **400** validation 실패(필드 형식/필수 누락)\n\n> 실제 요청/응답 예시는 Swagger UI의\
        \ **Examples** 섹션에 테스트 실행 결과로 자동 포함됩니다."
      operationId: auth-service-local-refresh
      parameters:
      - name: serviceCode
        in: path
        description: "서비스 코드 (예: SHOP, CRM, DEFAULT)"
        required: true
        schema:
          type: string
      - name: X-Device-Id
        in: header
        description: 디바이스 식별자
        required: true
        schema:
          type: string
        example: device-001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-services-serviceCode-auth-local-token-refresh1056639717'
            examples:
              auth-service-local-refresh:
                value: "{\n  \"refreshToken\" : \"refresh-token\"\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-services-serviceCode-auth-local-token-refresh416663598'
              examples:
                auth-service-local-refresh:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"meta\" : {\n    \"timestamp\"\
                    \ : \"2026-03-17T15:19:34.549885733\",\n    \"request\" : {\n\
                    \      \"path\" : \"/api/v1/services/SHOP/auth/local/token/refresh\"\
                    ,\n      \"method\" : \"POST\"\n    }\n  },\n  \"data\" : {\n\
                    \    \"serviceCode\" : \"SHOP\",\n    \"tokens\" : {\n      \"\
                    accessToken\" : \"access-token\",\n      \"accessExpiresInSec\"\
                    \ : 3600,\n      \"refreshToken\" : \"refresh-token\",\n     \
                    \ \"refreshExpiresInSec\" : 1209600\n    }\n  }\n}"
  /api/v1/services/{serviceCode}/auth/oauth2/{provider}/authorize-url:
    get:
      tags:
      - OAuth2
      summary: 서비스별 OAuth2 인가 URL 조회
      description: "serviceCode 기준 OAuth2 인가 URL 경로를 반환합니다.\n\n### 인증\n- 인증 불필요\n\
        - `serviceCode` 유효성/활성 상태 검증\n\n### 헤더\n- `X-Device-Id`: 디바이스 식별자 (선택)\n\n\
        ### Path 파라미터\n- `serviceCode`: 서비스 코드 (예: SHOP, CRM, DEFAULT)\n- `provider`:\
        \ OAuth2 공급자 (예: kakao, naver, google)\n\n### Query 파라미터\n- `returnUrl`: 로\
        그인 완료 후 리다이렉트할 상대 경로\n\n### 응답 바디 필드\n- `result`: 요청 처리 결과 (SUCCESS/ERROR)\n\
        - `meta.timestamp`: 응답 생성 시각 (서버 로컬 시간)\n- `meta.requestId`: 요청 추적 ID (있을\
        \ 때만 반환)\n- `meta.durationMs`: 처리 시간(ms)\n- `meta.request.path`: 요청 경로\n-\
        \ `meta.request.method`: HTTP 메서드\n- `meta.request.query`: 쿼리 문자열 (없으면 null)\n\
        - `meta.paging`: 페이징 메타 정보 (있을 때만 반환)\n- `meta.locale`: 응답 로케일 (있을 때만 반환)\n\
        - `error`: 오류 정보 (에러 응답에서만 포함)\n- `data`: OAuth2 인가 URL 경로 (예: /oauth2/authorization/{provider})\n\
        \n### 공통 에러\n- **401** 인증 실패/만료/위조\n- **403** 권한 없음(권한 필요한 API)\n- **400**\
        \ validation 실패(필드 형식/필수 누락)\n\n> 실제 요청/응답 예시는 Swagger UI의 **Examples** 섹션\
        에 테스트 실행 결과로 자동 포함됩니다."
      operationId: auth-service-oauth2-authorize-url
      parameters:
      - name: serviceCode
        in: path
        description: "서비스 코드 (예: SHOP, CRM, DEFAULT)"
        required: true
        schema:
          type: string
      - name: provider
        in: path
        description: "OAuth2 공급자 (예: kakao, naver, google)"
        required: true
        schema:
          type: string
      - name: returnUrl
        in: query
        description: 로그인 완료 후 리다이렉트할 상대 경로
        required: false
        schema:
          type: string
      - name: X-Device-Id
        in: header
        description: 디바이스 식별자 (선택)
        required: false
        schema:
          type: string
        example: device-001
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-services-serviceCode-auth-oauth2-provider-authorize-url1616597692'
              examples:
                auth-service-oauth2-authorize-url:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"meta\" : {\n    \"timestamp\"\
                    \ : \"2026-03-17T15:19:34.567965515\",\n    \"request\" : {\n\
                    \      \"path\" : \"/api/v1/services/SHOP/auth/oauth2/kakao/authorize-url\"\
                    ,\n      \"method\" : \"GET\",\n      \"query\" : \"returnUrl=/app/callback\"\
                    \n    }\n  },\n  \"data\" : \"/oauth2/authorization/kakao\"\n}"
