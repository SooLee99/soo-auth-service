        \ 응답 생성 시각 (서버 로컬 시간)\n- `meta.requestId`: 요청 추적 ID (있을 때만 반환)\n- `meta.durationMs`:\
        \ 처리 시간(ms)\n- `meta.request.path`: 요청 경로\n- `meta.request.method`: HTTP 메\
        서드\n- `meta.request.query`: 쿼리 문자열 (없으면 null)\n- `meta.paging`: 페이징 메타 정보\
        \ (있을 때만 반환)\n- `meta.locale`: 응답 로케일 (있을 때만 반환)\n- `error`: 오류 정보 (에러 응답에\
        서만 포함)\n- `data`: 토큰 재발급 결과\n- `data.serviceCode`: 적용 서비스 코드\n- `data.tokens`:\
        \ 재발급 토큰\n- `data.tokens.accessToken`: 액세스 토큰\n- `data.tokens.accessExpiresInSec`:\
        \ 액세스 토큰 만료(초)\n- `data.tokens.refreshToken`: 리프레시 토큰\n- `data.tokens.refreshExpiresInSec`:\
        \ 리프레시 토큰 만료(초)\n\n### 공통 에러\n- **401** 인증 실패/만료/위조\n- **403** 권한 없음(권한 필요\
