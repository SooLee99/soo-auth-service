  /api/v1/auth/admin/users/{userId}/status-audits:
    get:
      tags:
      - Admin User Status
      summary: 관리자 사용자 상태 변경 이력 조회
      description: "특정 사용자에 대한 차단/해제/탈퇴 상태 변경 이력을 조회합니다.\n\n### 인증\n- `Authorization:\
        \ Bearer {accessToken}` 필요\n- 권한: `ROLE_ADMIN` 필요\n\n### 헤더\n- `Authorization`:\
        \ Bearer 액세스 토큰\n\n### Path 파라미터\n- `userId`: 이력 조회 대상 사용자 ID\n\n### Query\
        \ 파라미터\n- `page`: 페이지 번호 (0부터 시작)\n- `size`: 페이지 크기\n\n### 응답 바디 필드\n- `result`:\
        \ 결과\n- `meta`: 메타 정보\n- `meta.timestamp`: 응답 생성 시각\n- `meta.request`: 요청\
        \ 정보\n- `meta.request.path`: 요청 경로\n- `meta.request.method`: HTTP 메서드\n- `meta.request.query`:\
        \ 쿼리 스트링(있으면 문자열, 없으면 null)\n- `data`: 상태 이력 페이지(Page)\n- `data.content`:\
        \ 상태 이력 목록\n- `data.content[].id`: 이력 ID\n- `data.content[].targetUserId`:\
        \ 대상 사용자 ID\n- `data.content[].actorUserId`: 처리 관리자/사용자 ID\n- `data.content[].actionType`:\
        \ 상태 변경 액션(BLOCK/UNBLOCK/SOFT_DELETE)\n- `data.content[].reason`: 사유\n- `data.content[].actionAt`:\
        \ 처리 시각\n- `data.totalElements`: 전체 건수\n- `data.totalPages`: 전체 페이지 수\n- `data.size`:\
        \ 페이지 크기\n- `data.number`: 현재 페이지 번호\n- `data.numberOfElements`: 현재 페이지 요소\
        \ 수\n- `data.first`: 첫 페이지 여부\n- `data.last`: 마지막 페이지 여부\n- `data.empty`:\
        \ 비어있는 페이지 여부\n- `data.pageable`: null\n- `data.sort`: null\n- `error`: 에러\
