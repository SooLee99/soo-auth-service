<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>Auth Service API (Swagger UI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/docs/swagger/assets/swagger-ui.css" />
    <style>
        body { margin: 0; }
    </style>
</head>
<body>
<div id="swagger-ui"></div>

<script src="/docs/swagger/assets/swagger-ui-bundle.js"></script>
<script src="/docs/swagger/assets/swagger-ui-standalone-preset.js"></script>
<script>
    window.onload = () => {
        SwaggerUIBundle({
            url: "/docs/openapi3.yaml",
            dom_id: "#swagger-ui",
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            layout: "StandaloneLayout",
        });
    };
</script>
</body>
</html>
