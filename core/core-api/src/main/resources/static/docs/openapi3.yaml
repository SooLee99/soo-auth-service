
openapi: 3.0.1
info:
  title: soo-auth-service API
  version: 1.0.0
  description: |
    인증 서비스 API 가이드 (REST API Docs)
    프론트엔드용 카테고리 기준 전체 API 명세.
servers:
  - url: http://localhost:8080
tags:
  - { name: Health, description: 헬스체크 }
  - { name: Auth-Local, description: 공용 로컬 인증 }
  - { name: Auth-Phone, description: 공용 휴대폰 인증 }
  - { name: Auth-Service-Local, description: 서비스 스코프 로컬 인증 }
  - { name: Auth-Service-Phone, description: 서비스 스코프 휴대폰 인증 }
  - { name: Auth-OAuth2, description: OAuth2 인가 URL }
  - { name: Admin-User, description: 관리자 사용자 관리 }
  - { name: Admin-Service, description: 관리자 서비스 관리 }
  - { name: Admin-SMS, description: 관리자 문자 관리 }
paths:
  /health:
    get:
      tags: [Health]
      summary: 공개 헬스체크
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/health:
    get:
      tags: [Health]
      summary: 관리자 상세 헬스체크
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/local/login:
    post:
      tags: [Auth-Local]
      summary: 로컬 로그인
      parameters: [{ $ref: '#/components/parameters/XDeviceIdRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessIssuedTokens' }

  /api/v1/auth/local/signup:
    post:
      tags: [Auth-Local]
      summary: 로컬 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
      responses:
        '200': { description: OK }

  /api/v1/auth/local/signup/phone:
    post:
      tags: [Auth-Local]
      summary: 전화번호 기반 가입
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneSignUpRequest' }
      responses:
        '200': { description: OK }

  /api/v1/auth/local/token/refresh:
    post:
      tags: [Auth-Local]
      summary: 토큰 재발급
      parameters: [{ $ref: '#/components/parameters/XDeviceIdRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessIssuedTokens' }
  /api/v1/auth/local/logout:
    post:
      tags: [Auth-Local]
      summary: 로그아웃
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/XDeviceIdRequired' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessOk' }

  /api/v1/auth/local/withdraw:
    post:
      tags: [Auth-Local]
      summary: 회원 탈퇴(소프트 삭제)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessOk' }

  /api/v1/auth/local/phone-verifications/request:
    post:
      tags: [Auth-Phone]
      summary: 인증번호 발급
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneIssueRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/local/phone-verifications/confirm:
    post:
      tags: [Auth-Phone]
      summary: 인증번호 확인
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneConfirmRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/services/{serviceCode}/auth/local/login:
    post:
      tags: [Auth-Service-Local]
      summary: 서비스 스코프 로그인
      parameters:
        - { $ref: '#/components/parameters/ServiceCode' }
        - { $ref: '#/components/parameters/XDeviceIdRequired' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/services/{serviceCode}/auth/local/signup:
    post:
      tags: [Auth-Service-Local]
      summary: 서비스 스코프 회원가입
      parameters: [{ $ref: '#/components/parameters/ServiceCode' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/services/{serviceCode}/auth/local/signup/phone:
    post:
      tags: [Auth-Service-Local]
      summary: 서비스 스코프 전화번호 가입
      parameters: [{ $ref: '#/components/parameters/ServiceCode' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneSignUpRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }
  /api/v1/services/{serviceCode}/auth/local/token/refresh:
    post:
      tags: [Auth-Service-Local]
      summary: 서비스 스코프 토큰 재발급
      parameters:
        - { $ref: '#/components/parameters/ServiceCode' }
        - { $ref: '#/components/parameters/XDeviceIdRequired' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/services/{serviceCode}/auth/local/logout:
    post:
      tags: [Auth-Service-Local]
      summary: 서비스 스코프 로그아웃
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ServiceCode' }
        - { $ref: '#/components/parameters/XDeviceIdRequired' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/services/{serviceCode}/auth/local/withdraw:
    post:
      tags: [Auth-Service-Local]
      summary: 서비스 스코프 탈퇴
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ServiceCode' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/services/{serviceCode}/auth/local/phone-verifications/request:
    post:
      tags: [Auth-Service-Phone]
      summary: 서비스 스코프 인증번호 발급
      parameters: [{ $ref: '#/components/parameters/ServiceCode' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneIssueRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/services/{serviceCode}/auth/local/phone-verifications/confirm:
    post:
      tags: [Auth-Service-Phone]
      summary: 서비스 스코프 인증번호 확인
      parameters: [{ $ref: '#/components/parameters/ServiceCode' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneConfirmRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/oauth2/{provider}/authorize-url:
    get:
      tags: [Auth-OAuth2]
      summary: OAuth2 인가 URL 조회(공용)
      parameters:
        - { $ref: '#/components/parameters/Provider' }
        - { $ref: '#/components/parameters/ReturnUrl' }
        - { $ref: '#/components/parameters/XDeviceIdOptional' }
      responses:
        '200': { $ref: '#/components/responses/SuccessString' }

  /api/v1/services/{serviceCode}/auth/oauth2/{provider}/authorize-url:
    get:
      tags: [Auth-OAuth2]
      summary: OAuth2 인가 URL 조회(서비스 스코프)
      parameters:
        - { $ref: '#/components/parameters/ServiceCode' }
        - { $ref: '#/components/parameters/Provider' }
        - { $ref: '#/components/parameters/ReturnUrl' }
        - { $ref: '#/components/parameters/XDeviceIdOptional' }
      responses:
        '200': { $ref: '#/components/responses/SuccessString' }
  /api/v1/auth/admin/login-history:
    get:
      tags: [Admin-User]
      summary: 로그인 이력 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/StartDate' }
        - { $ref: '#/components/parameters/EndDate' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/users:
    get:
      tags: [Admin-User]
      summary: 사용자 목록 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: userStatus, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
        - { name: authProvider, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/users/{userId}:
    get:
      tags: [Admin-User]
      summary: 사용자 상세 조회
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }
    patch:
      tags: [Admin-User]
      summary: 사용자 수정
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/users/{userId}/block:
    post:
      tags: [Admin-User]
      summary: 사용자 차단
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserBlockRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/users/{userId}/unblock:
    post:
      tags: [Admin-User]
      summary: 사용자 차단 해제
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/users/{userId}/delete:
    post:
      tags: [Admin-User]
      summary: 사용자 소프트 삭제
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserDeleteRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }
  /api/v1/auth/admin/users/{userId}/password/reset:
    post:
      tags: [Admin-User]
      summary: 비밀번호 초기화
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserPasswordResetRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/users/{userId}/tokens/revoke:
    post:
      tags: [Admin-User]
      summary: 토큰 강제 만료
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/users/blocked:
    get:
      tags: [Admin-User]
      summary: 차단 사용자 목록
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/users/deleted:
    get:
      tags: [Admin-User]
      summary: 탈퇴 사용자 목록
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/users/{userId}/status-audits:
    get:
      tags: [Admin-User]
      summary: 상태 감사 로그
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/services:
    get:
      tags: [Admin-Service]
      summary: 서비스 목록 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }
    post:
      tags: [Admin-Service]
      summary: 서비스 등록
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminServiceCreateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/services/{serviceCode}/deactivate:
    post:
      tags: [Admin-Service]
      summary: 서비스 비활성화
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ServiceCode' }]
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/sms/send:
    post:
      tags: [Admin-SMS]
      summary: 관리자 문자 발송
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSmsSendReq' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/sms/logs:
    get:
      tags: [Admin-SMS]
      summary: 문자 발송 이력 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/StartDate' }
        - { $ref: '#/components/parameters/EndDate' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

  /api/v1/auth/admin/sms/stats:
    get:
      tags: [Admin-SMS]
      summary: 문자 발송 통계 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/StartDate' }
        - { $ref: '#/components/parameters/EndDate' }
      responses:
        '200': { $ref: '#/components/responses/SuccessAny' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    XDeviceIdRequired: { name: X-Device-Id, in: header, required: true, schema: { type: string } }
    XDeviceIdOptional: { name: X-Device-Id, in: header, required: false, schema: { type: string } }
    ServiceCode: { name: serviceCode, in: path, required: true, schema: { type: string } }
    Provider: { name: provider, in: path, required: true, schema: { type: string, enum: [kakao, naver, google] } }
    ReturnUrl: { name: returnUrl, in: query, required: false, schema: { type: string } }
    UserId: { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
    Page: { name: page, in: query, required: false, schema: { type: integer, default: 0 } }
    Size: { name: size, in: query, required: false, schema: { type: integer, default: 20 } }
    StartDate: { name: startDate, in: query, required: false, schema: { type: string, format: date-time } }
    EndDate: { name: endDate, in: query, required: false, schema: { type: string, format: date-time } }
  responses:
    SuccessAny:
      description: SUCCESS
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseAny' }
    SuccessString:
      description: SUCCESS
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseString' }
    SuccessOk:
      description: SUCCESS
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseOk' }
    SuccessIssuedTokens:
      description: SUCCESS
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponseIssuedTokens' }
  schemas:
    ApiResponseAny:
      type: object
      properties:
        result: { type: string, example: SUCCESS }
        meta: { type: object }
        data: {}
        error: { type: object, nullable: true }
    ApiResponseString:
      allOf:
        - $ref: '#/components/schemas/ApiResponseAny'
        - type: object
          properties:
            data: { type: string }
    ApiResponseOk:
      allOf:
        - $ref: '#/components/schemas/ApiResponseAny'
        - type: object
          properties:
            data:
              type: object
              properties:
                result: { type: string, example: OK }
    ApiResponseIssuedTokens:
      allOf:
        - $ref: '#/components/schemas/ApiResponseAny'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/IssuedTokens' }
    IssuedTokens:
      type: object
      properties:
        accessToken: { type: string }
        accessExpiresInSec: { type: integer, format: int64 }
        refreshToken: { type: string }
        refreshExpiresInSec: { type: integer, format: int64 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string, nullable: true }
        logoutAll: { type: boolean }
    WithdrawRequest:
      type: object
      properties:
        reason: { type: string, nullable: true }
    PhoneIssueRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber: { type: string }
    PhoneConfirmRequest:
      type: object
      required: [phoneNumber, verificationId, code]
      properties:
        phoneNumber: { type: string }
        verificationId: { type: string }
        code: { type: string }
    PhoneSignUpRequest:
      type: object
      required: [phoneNumber, phoneVerificationToken]
      properties:
        phoneNumber: { type: string }
        phoneVerificationToken: { type: string }
    SignUpRequest:
      type: object
      required: [email, password, gender, phoneNumber, phoneVerificationToken]
      properties:
        email: { type: string }
        password: { type: string }
        name: { type: string, nullable: true }
        nickname: { type: string, nullable: true }
        gender: { type: string }
        phoneNumber: { type: string }
        phoneVerificationToken: { type: string }
        locale: { type: string, nullable: true }
        profileImageUrl: { type: string, nullable: true }
        thumbnailImageUrl: { type: string, nullable: true }
        birthyear: { type: string, nullable: true }
        birthday: { type: string, nullable: true }
    AdminUserUpdateRequest:
      type: object
      additionalProperties: true
    AdminUserBlockRequest:
      type: object
      properties:
        reason: { type: string, nullable: true }
    AdminUserDeleteRequest:
      type: object
      properties:
        reason: { type: string, nullable: true }
    AdminUserPasswordResetRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string }
    AdminServiceCreateRequest:
      type: object
      required: [serviceCode, serviceName]
      properties:
        serviceCode: { type: string }
        serviceName: { type: string }
    AdminSmsSendReq:
      type: object
      required: [to, text]
      properties:
        to: { type: string }
        text: { type: string }
