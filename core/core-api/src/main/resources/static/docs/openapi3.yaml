        description: 조회 종료 시각 (ISO-8601)
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer 관리자 액세스 토큰
        required: true
        schema:
          type: string
        example: Bearer token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-admin-sms-logs1758979252'
              examples:
