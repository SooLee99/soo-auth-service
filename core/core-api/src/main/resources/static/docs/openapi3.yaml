        기\n- `startDate`: 조회 시작 시각 (ISO-8601)\n- `endDate`: 조회 종료 시각 (ISO-8601)\n\n\
        ### 응답 바디 필드\n- `result`: 요청 처리 결과 (SUCCESS/ERROR)\n- `meta.timestamp`: 응답\
        \ 생성 시각 (서버 로컬 시간)\n- `meta.requestId`: 요청 추적 ID (있을 때만 반환)\n- `meta.durationMs`:\
        \ 처리 시간(ms)\n- `meta.request.path`: 요청 경로\n- `meta.request.method`: HTTP 메\
        서드\n- `meta.request.query`: 쿼리 문자열 (없으면 null)\n- `meta.paging`: 페이징 메타 정보\
        \ (있을 때만 반환)\n- `meta.locale`: 응답 로케일 (있을 때만 반환)\n- `error`: 오류 정보 (에러 응답에\
        서만 포함)\n- `data`: 문자 발송 이력 페이지\n- `data.content`: 문자 발송 이력 목록\n- `data.content[].id`:\
        \ 이력 ID\n- `data.content[].to`: 수신 번호\n- `data.content[].from`: 발신 번호\n- `data.content[].text`:\
        \ 발송 메시지\n- `data.content[].ok`: 성공 여부\n- `data.content[].provider`: 발송 제공\
        자\n- `data.content[].code`: 실패 코드(없으면 null)\n- `data.content[].msg`: 실패 메시\
        지(없으면 null)\n- `data.content[].at`: 발송 시각\n- `data.totalElements`: 전체 건수\n\
        - `data.totalPages`: 전체 페이지 수\n- `data.size`: 페이지 크기\n- `data.number`: 현재\
        \ 페이지 번호\n- `data.numberOfElements`: 현재 페이지 요소 수\n- `data.first`: 첫 페이지 여부\
        \n- `data.last`: 마지막 페이지 여부\n- `data.empty`: 비어있는 페이지 여부\n- `data.pageable`:\
        \ null\n- `data.sort`: null\n\n### 공통 에러\n- **401** 인증 실패/만료/위조\n- **403**\
        \ 권한 없음(권한 필요한 API)\n- **400** validation 실패(필드 형식/필수 누락)\n\n> 실제 요청/응답 예시\
