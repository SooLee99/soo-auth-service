                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"meta\" : {\n    \"timestamp\"\
                    \ : \"2026-04-06T10:27:49.566815875\",\n    \"request\" : {\n\
                    \      \"path\" : \"/api/v1/auth/admin/sms/logs\",\n      \"method\"\
                    \ : \"GET\",\n      \"query\" : \"page=0&size=20\"\n    }\n  },\n\
                    \  \"data\" : {\n    \"content\" : [ {\n      \"id\" : 1,\n  \
                    \    \"to\" : \"01012345678\",\n      \"from\" : \"029302266\"\
                    ,\n      \"text\" : \"[soo-auth] 인증번호 [123456] (유효 3분)\",\n  \
                    \    \"ok\" : true,\n      \"provider\" : \"SOLAPI\",\n      \"\
