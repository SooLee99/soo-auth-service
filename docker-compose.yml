name: soo-auth

networks:
  backend:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
  loki_data:
  grafana_data:

services:
  mariadb:
    image: mariadb:11.2
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql

    # 운영에서는 보통 DB 포트를 외부에 열지 않습니다.
    # 필요하면 아래처럼 로컬호스트로만 바인딩 권장:
    # ports:
    #   - "127.0.0.1:3306:3306"

    networks:
      backend:
        aliases:
          - mariadb

    # DB 준비 완료 대기
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      backend:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      PMA_HOST: mariadb
      PMA_ARBITRARY: 1
    ports:
      - "8081:80"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend

  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/tmp/loki
    networks:
      - backend

  promtail:
    image: grafana/promtail:2.9.8
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - ./logs:/workspace/logs:ro
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_HUB_USERNAME}/soo-auth-service:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul

      # 운영에서 사용할 프로파일로 지정
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-live}

      # Spring의 ${storage.database.core-db.*} 와 매핑되는 ENV (Relaxed binding)
      # (기존 설정 유지하되, 호스트를 "mariadb"로 고정)
      STORAGE_DATABASE_CORE_DB_URL: mariadb:3306/${MARIADB_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
      STORAGE_DATABASE_CORE_DB_USERNAME: ${MARIADB_USER}
      STORAGE_DATABASE_CORE_DB_PASSWORD: ${MARIADB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      JWT_KEYSTORE_PASSWORD: ${JWT_KEYSTORE_PASSWORD}
      JWT_KEY_ALIAS: ${JWT_KEY_ALIAS}
      JWT_KEY_PASSWORD: ${JWT_KEY_PASSWORD}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_ALLOWED_PROFILES: ${ADMIN_BOOTSTRAP_ALLOWED_PROFILES:-local,local-dev}
      ADMIN_BOOTSTRAP_ALLOW_WEAK_PASSWORD: ${ADMIN_BOOTSTRAP_ALLOW_WEAK_PASSWORD:-false}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}

    ports:
      - "8080:8080"

    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started
      promtail:
        condition: service_started
      grafana:
        condition: service_started

    networks:
      - backend
