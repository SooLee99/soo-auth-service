        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-services-serviceCode-auth-local-token-refresh1056639717'
            examples:
              auth-local-refresh:
                value: "{\n  \"refreshToken\" : \"refresh-token\"\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-local-token-refresh-1150988368'
              examples:
                auth-local-refresh:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"meta\" : {\n    \"timestamp\"\
                    \ : \"2026-03-17T15:19:34.341380719\",\n    \"request\" : {\n\
                    \      \"path\" : \"/api/v1/auth/local/token/refresh\",\n    \
                    \  \"method\" : \"POST\"\n    }\n  },\n  \"data\" : {\n    \"\
                    accessToken\" : \"access-token\",\n    \"accessExpiresInSec\"\
                    \ : 3600,\n    \"refreshToken\" : \"refresh-token\",\n    \"refreshExpiresInSec\"\
                    \ : 1209600\n  }\n}"
