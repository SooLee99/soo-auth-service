app:
  bootstrap:
    admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      allowed-profiles: ${ADMIN_BOOTSTRAP_ALLOWED_PROFILES:local,local-dev}
      allow-weak-password: ${ADMIN_BOOTSTRAP_ALLOW_WEAK_PASSWORD:false}
  health:
    links:
      docs:
        swagger: ${HEALTH_LINK_SWAGGER:http://localhost:8080/docs/swagger/index.html}
        docs: ${HEALTH_LINK_DOCS:http://localhost:8080/docs/index.html}
      monitoring:
        grafana: ${HEALTH_LINK_GRAFANA:http://localhost:3000}
        prometheus: ${HEALTH_LINK_PROMETHEUS:http://localhost:8080/actuator/prometheus}
        loki: ${HEALTH_LINK_LOKI:http://localhost:3100}
      logs:
        loki-query: ${HEALTH_LINK_LOKI_QUERY:http://localhost:3100/loki/api/v1/query_range}
        grafana-explore: ${HEALTH_LINK_GRAFANA_EXPLORE:http://localhost:3000/explore}
  security:
    jwt:
      issuer: "soo-auth-service"
      keystore:
        location: "classpath:keys/jwt-keystore.p12"
        password: ${JWT_KEYSTORE_PASSWORD}
        key-alias: ${JWT_KEY_ALIAS}
        key-password: ${JWT_KEY_PASSWORD}
        type: "PKCS12"

spring:
  application:
    name: core-api

  profiles:
    active: local

  config:
    import:
      - monitoring.yml
      - logging.yml
      - redis.yml
      - db-core.yml
      - client-example.yml
      - optional:file:.env[.properties]

  web:
    resources:
      add-mappings: true
  mvc:
    static-path-pattern: "/**"

  security:
    oauth2:
      client:
        registration:
          # ✅ Google (기본 provider 내장)
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [openid, profile, email]
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          # ✅ Kakao
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: [profile_nickname, account_email]
            client-name: Kakao

          # ✅ Naver
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver

        provider:
          # ✅ Kakao endpoints
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
            user-info-authentication-method: header

          # ✅ Naver endpoints
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
            user-info-authentication-method: header

server:
  tomcat:
    max-connections: 20000
    threads:
      max: 600
      min-spare: 100

---
spring:
  config:
    activate:
      on-profile: local
app:
  bootstrap:
    admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      username: ${ADMIN_BOOTSTRAP_USERNAME}
      password: ${ADMIN_BOOTSTRAP_PASSWORD}
      allow-weak-password: ${ADMIN_BOOTSTRAP_ALLOW_WEAK_PASSWORD:true}

---
spring:
  config:
    activate:
      on-profile: local-dev
app:
  bootstrap:
    admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      username: ${ADMIN_BOOTSTRAP_USERNAME}
      password: ${ADMIN_BOOTSTRAP_PASSWORD}
      allow-weak-password: ${ADMIN_BOOTSTRAP_ALLOW_WEAK_PASSWORD:true}

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: staging

---
spring:
  config:
    activate:
      on-profile: live
