# Country gating
# - Preferred: Cloudflare header `CF-IPCountry`
# - Fallback: upstream/LB custom header `X-Geo-Country`
map $http_cf_ipcountry $geo_country_code {
    default $http_cf_ipcountry;
    ""      $http_x_geo_country;
}

map $geo_country_code $is_kr {
    default 0;
    ~*^KR$  1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name soo.it.kr www.soo.it.kr;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name soo.it.kr www.soo.it.kr;

    ssl_certificate     /etc/nginx/ssl/www.soo.it.kr_fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/www.soo.it.kr.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 디버그용: 안정화 후 제거 가능
    add_header X-Debug-CF-IPCountry $http_cf_ipcountry always;
    add_header X-Debug-Geo-Country  $http_x_geo_country always;
    add_header X-Debug-Is-KR        $is_kr always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 관리자 API: 한국 제한 + 사내/VPN 고정 IP 제한
    location ^~ /api/v1/auth/admin/ {
        if ($is_kr = 0) { return 403; }

        # 실제 허용 IP/VPN 공인 IP로 교체
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        # allow 203.0.113.10;
        # allow 198.51.100.20;
        deny all;

        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth2 시작/콜백: 문서 기준 /api/v1/auth/oauth2/*
    location ^~ /api/v1/auth/oauth2/ {
        if ($is_kr = 0) { return 403; }

        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /login/ {
        if ($is_kr = 0) { return 403; }

        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드 API: 한국만 허용
    location ^~ /api/ {
        if ($is_kr = 0) { return 403; }

        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # 관리자 프론트엔드 SPA: 한국만 허용
    location ^~ /admin/ {
        if ($is_kr = 0) { return 403; }

        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # 그 외 요청은 프론트엔드로 전달: 한국만 허용
    location / {
        if ($is_kr = 0) { return 403; }

        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
