openapi: 3.0.1
info:
  title: soo-auth-service API
  description: 인증 서비스 API 가이드 (REST API Docs).
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost
tags:
- name: Health
  description: 헬스체크/모니터링 API
- name: Local Auth
  description: 사용자 로컬 인증 API(로그인/회원가입/토큰/로그아웃/탈퇴)
- name: Local Phone
  description: 휴대폰 인증 API(인증번호 발급/확인)
- name: OAuth2
  description: 소셜 로그인 시작 URL API
- name: Admin Audit
  description: 관리자 감사 로그 API(로그인 이력)
- name: Admin Users
  description: 관리자 사용자 관리 API(조회/수정/비밀번호/토큰/삭제)
- name: Admin User Status
  description: 관리자 사용자 상태 API(차단/해제/상태 이력/차단·삭제 목록)
- name: Admin SMS
  description: 관리자 SMS 운영 API(발송/이력/통계)
paths:
  /api/v1/auth/admin/health:
    get:
      tags:
      - Health
      summary: 관리자 상세 헬스 체크
      description: "관리자 권한으로 DB/Redis/System/링크 상세 상태를 조회합니다.\n\n### 인증\n- `Authorization:\
        \ Bearer {accessToken}` 필요\n- 권한: `ROLE_ADMIN` 필요\n\n### 헤더\n- `Authorization`:\
        \ Bearer 액세스 토큰\n\n### 응답 바디 필드\n- `result`: 결과\n- `meta.timestamp`: 응답 생성\
        \ 시각\n- `meta.request.path`: 요청 경로\n- `meta.request.method`: 요청 메서드\n- `data.status`:\
        \ 전체 헬스 상태\n- `data.application`: 애플리케이션 이름\n- `data.profiles`: 활성 프로파일 목록\
        \n- `data.uptimeSec`: 업타임(초)\n- `data.components.database.status`: DB 상태\n\
        - `data.components.database.latencyMs`: DB 응답시간(ms)\n- `data.components.redis.status`:\
        \ Redis 상태\n- `data.components.redis.latencyMs`: Redis 응답시간(ms)\n- `data.system.jvm.heapUsedBytes`:\
        \ JVM 사용 Heap(bytes)\n- `data.system.jvm.heapMaxBytes`: JVM 최대 Heap(bytes)\n\
        - `data.system.jvm.processors`: 가용 CPU 코어 수\n- `data.system.disk.totalBytes`:\
        \ 디스크 전체 용량(bytes)\n- `data.system.disk.usableBytes`: 디스크 사용 가능 용량(bytes)\n\
        - `data.links.docs.swagger`: Swagger UI URL\n- `data.links.docs.docs`: API\
        \ 문서 URL\n- `data.links.monitoring.grafana`: Grafana URL\n- `data.links.monitoring.prometheus`:\
        \ Prometheus 메트릭 URL\n- `data.links.monitoring.loki`: Loki URL\n- `data.links.logs.lokiQuery`:\
        \ Loki Query API URL\n- `data.links.logs.grafanaExplore`: Grafana Explore\
        \ URL\n\n### 공통 에러\n- **401** 인증 실패/만료/위조\n- **403** 권한 없음(권한 필요한 API)\n-\
        \ **400** validation 실패(필드 형식/필수 누락)\n\n> 실제 요청/응답 예시는 Swagger UI의 **Examples**\
        \ 섹션에 테스트 실행 결과로 자동 포함됩니다."
      operationId: auth-admin-health
      parameters:
      - name: Authorization
        in: header
        description: Bearer 액세스 토큰
        required: true
        schema:
          type: string
        example: Bearer token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-admin-health553791584'
              examples:
                auth-admin-health:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"meta\" : {\n    \"timestamp\"\
                    \ : \"2026-04-06T10:27:51.680751332\",\n    \"request\" : {\n\
                    \      \"path\" : \"/api/v1/auth/admin/health\",\n      \"method\"\
                    \ : \"GET\"\n    }\n  },\n  \"data\" : {\n    \"status\" : \"\
                    UP\",\n    \"application\" : \"core-api\",\n    \"profiles\" :\
                    \ [ \"dev\" ],\n    \"uptimeSec\" : 10,\n    \"components\" :\
                    \ {\n      \"database\" : {\n        \"status\" : \"UP\",\n  \
                    \      \"latencyMs\" : 2\n      },\n      \"redis\" : {\n    \
                    \    \"status\" : \"UP\",\n        \"latencyMs\" : 1\n      }\n\
                    \    },\n    \"system\" : {\n      \"jvm\" : {\n        \"heapUsedBytes\"\
                    \ : 1000,\n        \"heapMaxBytes\" : 10000,\n        \"processors\"\
                    \ : 4\n      },\n      \"disk\" : {\n        \"totalBytes\" :\
                    \ 100000,\n        \"usableBytes\" : 90000\n      }\n    },\n\
                    \    \"links\" : {\n      \"docs\" : {\n        \"swagger\" :\
                    \ \"https://api.example.com/docs/swagger/index.html\",\n     \
                    \   \"docs\" : \"https://api.example.com/docs/index.html\"\n \
                    \     },\n      \"monitoring\" : {\n        \"grafana\" : \"https://api.example.com:3000\"\
                    ,\n        \"prometheus\" : \"https://api.example.com/actuator/prometheus\"\
                    ,\n        \"loki\" : \"https://api.example.com:3100\"\n     \
                    \ },\n      \"logs\" : {\n        \"lokiQuery\" : \"https://api.example.com:3100/loki/api/v1/query_range\"\
                    ,\n        \"grafanaExplore\" : \"https://api.example.com:3000/explore\"\
                    \n      }\n    }\n  }\n}"
  /api/v1/auth/admin/login-history:
    get:
      tags:
      - Admin Audit
      summary: 관리자 로그인 이력 조회
      description: "관리자 권한으로 로그인 이력을 페이징 조회합니다.\n\n### 인증\n- `Authorization: Bearer\
        \ {accessToken}` 필요\n- 권한: `ROLE_ADMIN` 필요\n\n### 헤더\n- `Authorization`: Bearer\
        \ 액세스 토큰\n\n### Query 파라미터\n- `page`: 페이지 번호 (0부터 시작)\n- `size`: 페이지 크기\n\
        - `sort`: 정렬 조건(예: createdAt,desc)\n- `startDate`: 조회 시작 시각 (ISO-8601)\n-\
        \ `endDate`: 조회 종료 시각 (ISO-8601)\n\n### 응답 바디 필드\n- `result`: 결과\n- `meta`:\
        \ 메타 정보\n- `meta.timestamp`: 응답 생성 시각\n- `meta.request`: 요청 정보\n- `meta.request.path`:\
        \ 요청 경로\n- `meta.request.method`: HTTP 메서드\n- `meta.request.query`: 쿼리 스트링\
        (있으면 문자열, 없으면 null)\n- `meta.requestId`: 요청 ID(있으면 문자열)\n- `meta.durationMs`:\
        \ 처리 시간(ms)\n- `meta.locale`: 로케일\n- `meta.paging`: 페이징 메타(있는 경우)\n- `data`:\
        \ 로그인 이력 페이지(Page)\n- `data.content`: 로그인 이력 목록(Page.content)\n- `data.content[].id`:\
        \ 이력 ID\n- `data.content[].userId`: 사용자 ID\n- `data.content[].userEmail`:\
        \ 사용자 이메일\n- `data.content[].loginType`: 로그인 유형\n- `data.content[].status`:\
        \ 로그인 상태\n- `data.content[].ipAddress`: IP 주소(없으면 null)\n- `data.content[].userAgent`:\
        \ User-Agent(없으면 null)\n- `data.content[].deviceId`: 디바이스 ID(없으면 null)\n-\
        \ `data.content[].failureReason`: 실패 사유(없으면 null)\n- `data.content[].createdAt`:\
        \ 로그인 시각\n- `data.totalElements`: 전체 건수\n- `data.totalPages`: 전체 페이지 수\n-\
        \ `data.size`: 페이지 크기\n- `data.number`: 현재 페이지 번호\n- `data.numberOfElements`:\
        \ 현재 페이지 요소 수\n- `data.first`: 첫 페이지 여부\n- `data.last`: 마지막 페이지 여부\n- `data.empty`:\
        \ 비어있는 페이지 여부\n- `data.pageable`: null\n- `data.sort`: null\n- `error`: 에러\
        \ 정보(실패 시에만 존재)\n\n### 공통 에러\n- **401** 인증 실패/만료/위조\n- **403** 권한 없음(권한 필요\
        한 API)\n- **400** validation 실패(필드 형식/필수 누락)\n\n> 실제 요청/응답 예시는 Swagger UI의\
        \ **Examples** 섹션에 테스트 실행 결과로 자동 포함됩니다."
      operationId: auth-admin-login-history
      parameters:
      - name: page
        in: query
        description: 페이지 번호 (0부터 시작)
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: 페이지 크기
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "정렬 조건(예: createdAt,desc)"
        required: false
        schema:
          type: string
      - name: startDate
        in: query
        description: 조회 시작 시각 (ISO-8601)
        required: false
        schema:
          type: string
      - name: endDate
        in: query
        description: 조회 종료 시각 (ISO-8601)
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer 액세스 토큰
        required: true
        schema:
          type: string
        example: Bearer token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-admin-login-history-262485762'
              examples:
                auth-admin-login-history:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"meta\" : {\n    \"timestamp\"\
                    \ : \"2026-04-06T10:27:51.065282843\",\n    \"request\" : {\n\
                    \      \"path\" : \"/api/v1/auth/admin/login-history\",\n    \
                    \  \"method\" : \"GET\",\n      \"query\" : \"page=0&size=20\"\
                    \n    }\n  },\n  \"data\" : {\n    \"content\" : [ {\n      \"\
                    id\" : 1,\n      \"userId\" : 1,\n      \"userEmail\" : \"user@example.com\"\
                    ,\n      \"loginType\" : \"LOCAL\",\n      \"status\" : \"SUCCESS\"\
                    ,\n      \"ipAddress\" : \"127.0.0.1\",\n      \"userAgent\" :\
                    \ \"Mozilla/5.0\",\n      \"deviceId\" : \"device-001\",\n   \
                    \   \"failureReason\" : null,\n      \"createdAt\" : \"2025-01-01T12:00:00\"\
                    \n    } ],\n    \"pageable\" : {\n      \"pageNumber\" : 0,\n\
                    \      \"pageSize\" : 20,\n      \"sort\" : {\n        \"empty\"\
                    \ : true,\n        \"sorted\" : false,\n        \"unsorted\" :\
                    \ true\n      },\n      \"offset\" : 0,\n      \"paged\" : true,\n\
                    \      \"unpaged\" : false\n    },\n    \"totalElements\" : 1,\n\
                    \    \"totalPages\" : 1,\n    \"last\" : true,\n    \"size\" :\
                    \ 20,\n    \"number\" : 0,\n    \"sort\" : {\n      \"empty\"\
                    \ : true,\n      \"sorted\" : false,\n      \"unsorted\" : true\n\
                    \    },\n    \"first\" : true,\n    \"numberOfElements\" : 1,\n\
                    \    \"empty\" : false\n  }\n}"
  /api/v1/auth/admin/services:
    get:
      tags:
      - Admin
      summary: 관리자 서비스 목록 조회
      description: "등록된 서비스 목록을 페이징 조회합니다.\n\n### 인증\n- `Authorization: Bearer {accessToken}`\
        \ 필요\n- 권한: `ROLE_ADMIN` 필요\n\n### 헤더\n- `Authorization`: Bearer 관리자 액세스 토\
        큰\n\n### Query 파라미터\n- `page`: 페이지 번호 (0부터 시작)\n- `size`: 페이지 크기\n\n### 응답\
        \ 바디 필드\n- `result`: 요청 처리 결과 (SUCCESS/ERROR)\n- `meta.timestamp`: 응답 생성 시\
        각 (서버 로컬 시간)\n- `meta.requestId`: 요청 추적 ID (있을 때만 반환)\n- `meta.durationMs`:\
        \ 처리 시간(ms)\n- `meta.request.path`: 요청 경로\n- `meta.request.method`: HTTP 메\
        서드\n- `meta.request.query`: 쿼리 문자열 (없으면 null)\n- `meta.paging`: 페이징 메타 정보\
        \ (있을 때만 반환)\n- `meta.locale`: 응답 로케일 (있을 때만 반환)\n- `error`: 오류 정보 (에러 응답에\
        서만 포함)\n- `data`: 서비스 목록 페이지\n- `data.content`: 서비스 목록\n- `data.content[].serviceId`:\
        \ 서비스 ID\n- `data.content[].serviceCode`: 서비스 코드\n- `data.content[].serviceName`:\
        \ 서비스 이름\n- `data.content[].serviceStatus`: 서비스 상태(ACTIVE/INACTIVE)\n- `data.totalElements`:\
        \ 전체 건수\n- `data.totalPages`: 전체 페이지 수\n- `data.size`: 페이지 크기\n- `data.number`:\
        \ 현재 페이지 번호\n- `data.numberOfElements`: 현재 페이지 요소 수\n- `data.first`: 첫 페이지\
        \ 여부\n- `data.last`: 마지막 페이지 여부\n- `data.empty`: 비어있는 페이지 여부\n- `data.pageable`:\
        \ null\n- `data.sort`: null\n\n### 공통 에러\n- **401** 인증 실패/만료/위조\n- **403**\
        \ 권한 없음(권한 필요한 API)\n- **400** validation 실패(필드 형식/필수 누락)\n\n> 실제 요청/응답 예시\
        는 Swagger UI의 **Examples** 섹션에 테스트 실행 결과로 자동 포함됩니다."
      operationId: auth-admin-service-list
      parameters:
      - name: page
        in: query
        description: 페이지 번호 (0부터 시작)
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: 페이지 크기
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer 관리자 액세스 토큰
        required: true
        schema:
          type: string
        example: Bearer token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-admin-services-2117864034'
              examples:
                auth-admin-service-list:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"meta\" : {\n    \"timestamp\"\
                    \ : \"2026-03-20T21:07:34.16742564\",\n    \"request\" : {\n \
                    \     \"path\" : \"/api/v1/auth/admin/services\",\n      \"method\"\
                    \ : \"GET\",\n      \"query\" : \"page=0&size=20\"\n    }\n  },\n\
                    \  \"data\" : {\n    \"content\" : [ {\n      \"serviceId\" :\
                    \ 10,\n      \"serviceCode\" : \"SHOP\",\n      \"serviceName\"\
                    \ : \"Shopping Service\",\n      \"serviceStatus\" : \"ACTIVE\"\
                    \n    } ],\n    \"pageable\" : {\n      \"pageNumber\" : 0,\n\
                    \      \"pageSize\" : 20,\n      \"sort\" : {\n        \"empty\"\
                    \ : true,\n        \"sorted\" : false,\n        \"unsorted\" :\
                    \ true\n      },\n      \"offset\" : 0,\n      \"paged\" : true,\n\
                    \      \"unpaged\" : false\n    },\n    \"totalElements\" : 1,\n\
                    \    \"totalPages\" : 1,\n    \"last\" : true,\n    \"size\" :\
                    \ 20,\n    \"number\" : 0,\n    \"sort\" : {\n      \"empty\"\
                    \ : true,\n      \"sorted\" : false,\n      \"unsorted\" : true\n\
                    \    },\n    \"numberOfElements\" : 1,\n    \"first\" : true,\n\
                    \    \"empty\" : false\n  }\n}"
    post:
      tags:
      - Admin
      summary: 관리자 서비스 등록
      description: "새 서비스 코드를 등록합니다.\n\n### 인증\n- `Authorization: Bearer {accessToken}`\
        \ 필요\n- 권한: `ROLE_ADMIN` 필요\n\n### 헤더\n- `Authorization`: Bearer 관리자 액세스 토\
        큰\n\n### 요청 바디 필드\n- `serviceCode`: 서비스 코드\n- `serviceName`: 서비스 이름\n\n###\
        \ 응답 바디 필드\n- `result`: 요청 처리 결과 (SUCCESS/ERROR)\n- `meta.timestamp`: 응답 생\
        성 시각 (서버 로컬 시간)\n- `meta.requestId`: 요청 추적 ID (있을 때만 반환)\n- `meta.durationMs`:\
        \ 처리 시간(ms)\n- `meta.request.path`: 요청 경로\n- `meta.request.method`: HTTP 메\
        서드\n- `meta.request.query`: 쿼리 문자열 (없으면 null)\n- `meta.paging`: 페이징 메타 정보\
        \ (있을 때만 반환)\n- `meta.locale`: 응답 로케일 (있을 때만 반환)\n- `error`: 오류 정보 (에러 응답에\
        서만 포함)\n- `data`: 서비스 정보\n- `data.serviceId`: 서비스 ID\n- `data.serviceCode`:\
        \ 서비스 코드\n- `data.serviceName`: 서비스 이름\n- `data.serviceStatus`: 서비스 상태(ACTIVE/INACTIVE)\n\
        \n### 공통 에러\n- **401** 인증 실패/만료/위조\n- **403** 권한 없음(권한 필요한 API)\n- **400**\
        \ validation 실패(필드 형식/필수 누락)\n\n> 실제 요청/응답 예시는 Swagger UI의 **Examples** 섹션\
        에 테스트 실행 결과로 자동 포함됩니다."
      operationId: auth-admin-service-register
      parameters:
      - name: Authorization
        in: header
        description: Bearer 관리자 액세스 토큰
        required: true
        schema:
          type: string
        example: Bearer token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-admin-services-932807326'
            examples:
              auth-admin-service-register:
                value: "{\n  \"serviceCode\" : \"SHOP\",\n  \"serviceName\" : \"Shopping\
                  \ Service\"\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-admin-services1455034867'
              examples:
                auth-admin-service-register:
                  value: "{\n  \"result\" : \"SUCCESS\",\n  \"meta\" : {\n    \"timestamp\"\
                    \ : \"2026-03-20T21:07:34.247214788\",\n    \"request\" : {\n\
                    \      \"path\" : \"/api/v1/auth/admin/services\",\n      \"method\"\
                    \ : \"POST\"\n    }\n  },\n  \"data\" : {\n    \"serviceId\" :\
                    \ 10,\n    \"serviceCode\" : \"SHOP\",\n    \"serviceName\" :\
                    \ \"Shopping Service\",\n    \"serviceStatus\" : \"ACTIVE\"\n\
                    \  }\n}"
  /api/v1/auth/admin/users:
    get:
      tags:
      - Admin Users
      summary: 관리자 사용자 목록 조회
      description: "검색/필터 조건으로 사용자 목록을 페이징 조회합니다.\n\n### 인증\n- `Authorization: Bearer\
        \ {accessToken}` 필요\n- 권한: `ROLE_ADMIN` 필요\n\n### 헤더\n- `Authorization`: Bearer\
        \ 액세스 토큰\n\n### Query 파라미터\n- `page`: 페이지 번호 (0부터 시작)\n- `size`: 페이지 크기\n\
        - `keyword`: 검색어(email/name/nickname/phone)\n- `userStatus`: 상태 필터(ACTIVE/BLOCKED/SOFT_DELETED)\n\
