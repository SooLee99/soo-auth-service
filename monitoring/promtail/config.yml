server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: soo-auth-file-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: soo-auth
          app: core-api
          __path__: /workspace/logs/*.log
